[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

# ============================ PROJECT (PEP 621) ============================
# This table is the single source of truth for package metadata.
# There is deliberately no setup.py / setup.cfg: everything lives here.

[project]
name = "safe-ice"
version = "0.2.0"
description = "Safe Cross-Entropy-Based Importance Sampling for rare event simulation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
authors = [{ name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }]
maintainers = [{ name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }]
keywords = [
  "importance-sampling",
  "rare-events",
  "reliability-analysis",
  "monte-carlo",
  "cross-entropy",
  "structural-reliability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]

# Runtime dependencies. Floors are the oldest versions actually exercised;
# the upper bounds only exclude majors that have not been released yet.
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
# Interactive plotly dashboards (safe_ice.analysis.interactive_visualization).
viz = [
  "plotly>=5.18",
  "seaborn>=0.13",
  "pandas>=2.0",
]
# Memory instrumentation for examples/performance_benchmark.py.
perf = [
  "psutil>=5.9",
]
# Poetry's resolver rejects self-referential extras, so `all` is expanded.
all = [
  "plotly>=5.18",
  "seaborn>=0.13",
  "pandas>=2.0",
  "psutil>=5.9",
]

[project.scripts]
safe-ice = "safe_ice.cli:main"

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/adaptive-importance-sampling-ice"
Documentation = "https://safe-ice.readthedocs.io/"
Repository = "https://github.com/DiogoRibeiro7/adaptive-importance-sampling-ice"
Issues = "https://github.com/DiogoRibeiro7/adaptive-importance-sampling-ice/issues"
Changelog = "https://github.com/DiogoRibeiro7/adaptive-importance-sampling-ice/blob/main/CHANGELOG.md"

# ==================== DEVELOPMENT GROUPS (PEP 735) ====================
# Not published with the package. Install with:
#   pip install --group dev      (pip >= 25.1)
#   uv sync --group dev
#   poetry install --with dev    (poetry >= 2.1)

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
  "pytest-xdist>=3.8.0,<4.0.0",
  "pytest-benchmark>=5.2.3,<6.0.0",
  "mypy>=2.3.1,<3.0.0",
  "ruff>=0.16.3,<1.0.0",
  "pre-commit>=4.6.2,<5.0.0",
  "bandit>=1.9.4,<2.0.0",
  "pip-audit>=2.10.1,<3.0.0",
  "tomlkit>=0.15.1,<1.0.0",
]
docs = [
  "sphinx>=9.0.4,<10.0.0",
  "sphinx-rtd-theme>=3.1.0,<4.0.0",
  "sphinx-autodoc-typehints>=3.6.1,<4.0.0",
  "myst-parser>=5.1.0,<6.0.0",
]
benchmark = [
  "pandas>=3.0.5,<4.0.0",
  "seaborn>=0.13.2,<1.0.0",
  "jupyter>=1.1.1,<2.0.0",
  "ipykernel>=7.3.0,<8.0.0",
]

# ==================== POETRY (build backend only) ====================
# Poetry reads metadata from [project]; this section configures the build.

[tool.poetry]
packages = [{ include = "safe_ice" }]
include = [{ path = "safe_ice/py.typed", format = ["sdist", "wheel"] }]
exclude = ["safe_ice/**/tests"]

# ==================== RUFF ====================
[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["docs/source/conf.py"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "ARG",  # flake8-unused-arguments
  "SIM",  # flake8-simplify
  "NPY",  # numpy-specific rules
  "RUF",  # ruff-specific rules
  "PIE",  # flake8-pie
  "PTH",  # flake8-use-pathlib
]
ignore = [
  "E501",    # line length is enforced by the formatter
  "B008",    # function call in default argument
  # Greek letters (σ, λ, κ, Ω, μ) are the notation of the paper this
  # implements, and are intentional everywhere they appear.
  "RUF001",  # ambiguous unicode in strings
  "RUF002",  # ambiguous unicode in docstrings
  "RUF003",  # ambiguous unicode in comments
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]           # re-exports
"tests/**/*.py" = ["ARG", "S101"]  # fixtures and asserts
"examples/**/*.py" = ["T201"]      # prints are the point
"benchmarks/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["safe_ice"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

# ==================== MYPY ====================
[tool.mypy]
# Analysis targets 3.12 even though the package supports 3.11: numpy >= 2.5
# ships stubs that use PEP 695 `type` statements, and mypy rejects those
# outright when told to target 3.11, before it checks any of our code.
# Ruff still lints against py311, and CI runs the test suite on 3.11, so real
# incompatibilities are still caught.
python_version = "3.12"
files = ["safe_ice"]
strict = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Third-party packages without bundled type information.
[[tool.mypy.overrides]]
module = [
  "matplotlib.*",
  "mpl_toolkits.*",
  "pandas.*",
  "plotly.*",
  "psutil.*",
  "scipy.*",
  "seaborn.*",
]
ignore_missing_imports = true

# Numba ships no type information, so its @jit decorator is untyped and would
# otherwise strip the annotations off every function it wraps.
[[tool.mypy.overrides]]
module = ["safe_ice.core.safe_ice_optimized"]
disallow_untyped_decorators = false

# Examples and scripts are illustrative, not part of the typed API surface.
[[tool.mypy.overrides]]
module = ["tests.*", "examples.*", "scripts.*", "benchmarks.*"]
ignore_errors = true

# ==================== PYTEST ====================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--tb=short",
  "--import-mode=importlib",
  # Slow tests are opt-in: run the full suite with `pytest -m ''`.
  "-m",
  "not slow",
]
markers = [
  "slow: long-running statistical tests (deselected by default)",
  "integration: end-to-end tests across multiple modules",
  "benchmark: performance benchmarks",
]
filterwarnings = [
  "error",
  "ignore::UserWarning",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

# ==================== COVERAGE ====================
[tool.coverage.run]
branch = true
source = ["safe_ice"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise AssertionError",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
  "class .*\\bProtocol\\):",
  "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

# ==================== BANDIT ====================
[tool.bandit]
exclude_dirs = ["tests", "scripts", "examples", "benchmarks"]
skips = ["B101"]  # assert_used: asserts are used as internal invariants
