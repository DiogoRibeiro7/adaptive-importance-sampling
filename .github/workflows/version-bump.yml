# Bump the package version and open a pull request for review.
#
# This used to run on every push to main and push the bump straight to the
# branch, which meant the version changed without anyone asking and the release
# workflow's "tag matches version" check could never be relied on. Releases are
# deliberate acts, so the bump is now triggered by hand and lands via PR.
name: Version bump

on:
  workflow_dispatch:
    inputs:
      level:
        description: 'Which part of the version to bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install editor deps
        run: |
          python -m pip install --upgrade pip
          pip install tomlkit

      - name: Preview the change
        run: python scripts/pyproject_editor.py --check bump-version "${{ inputs.level }}"

      - name: Bump version
        id: bump
        run: |
          python scripts/pyproject_editor.py bump-version "${{ inputs.level }}"
          new_version="$(python -c "
          import tomlkit, pathlib
          doc = tomlkit.parse(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          print(doc['project']['version'])
          ")"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/bump-${{ steps.bump.outputs.version }}
          title: 'chore: bump version to ${{ steps.bump.outputs.version }}'
          commit-message: 'chore: bump version to ${{ steps.bump.outputs.version }}'
          body: |
            Bumps the `${{ inputs.level }}` version to `${{ steps.bump.outputs.version }}`.

            Before merging:
            - [ ] Move the `Unreleased` section of `CHANGELOG.md` under this version
            - [ ] After merging, tag `v${{ steps.bump.outputs.version }}` to trigger the release workflow
          delete-branch: true
