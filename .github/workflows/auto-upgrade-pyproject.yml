# Raise the declared floors for development tooling and open a PR.
#
# Deliberately excludes the `main` group. Runtime floors in [project]
# dependencies are the oldest versions actually exercised, not the newest
# available; raising them automatically would silently drop support for the
# NumPy and SciPy versions the package claims to support. Runtime bumps are a
# judgement call and stay manual.
name: Auto upgrade pyproject constraints

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install tomlkit packaging poetry

      - name: Upgrade development constraints
        run: |
          python scripts/pyproject_updater.py \
            --strategy caret \
            --groups dev,docs,benchmark \
            --respect-major \
            --no-prerelease

      - name: Refresh the lock file
        # Editing pyproject invalidates the lock's content-hash. Without this
        # the branch lands a lock that `poetry check` rejects and
        # `poetry install` refuses to use.
        run: |
          if ! git diff --quiet -- pyproject.toml; then
            poetry lock
            poetry check
          fi

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/upgrade-pyproject-constraints
          title: "chore: upgrade pyproject constraints"
          commit-message: "chore: upgrade development dependency constraints"
          body: |
            Raises the declared floors for the `dev`, `docs` and `benchmark`
            dependency groups to the latest releases on PyPI, staying within
            the current major, and refreshes `poetry.lock` to match.

            Runtime dependencies in `[project]` are deliberately untouched:
            those floors record the oldest versions the package is tested
            against.
          add-paths: |
            pyproject.toml
            poetry.lock
          delete-branch: true
