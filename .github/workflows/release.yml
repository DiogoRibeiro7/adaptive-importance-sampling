name: Release

# Publishing to PyPI is deliberately not wired up yet. When you are ready,
# register the project as a PyPI Trusted Publisher and add a job that runs
# `pypa/gh-action-pypi-publish` with `id-token: write` — no API token needed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package and tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-xdist mypy ruff

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Run the full test suite
        run: pytest -m "" -n auto

      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python -c 'import safe_ice; print(safe_ice.__version__)')"
          echo "tag=$tag_version package=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $pkg_version"
            exit 1
          fi

  build:
    name: Build distribution
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  github-release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Extract release notes from CHANGELOG
        id: notes
        uses: ffurrer2/extract-release-notes@v3
        continue-on-error: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file=notes.md
          if [ -n "${{ steps.notes.outputs.release_notes }}" ]; then
            printf '%s\n' "${{ steps.notes.outputs.release_notes }}" > "$notes_file"
          else
            printf 'See CHANGELOG.md for details.\n' > "$notes_file"
          fi

          prerelease=""
          case "$GITHUB_REF_NAME" in
            *rc*|*alpha*|*beta*) prerelease="--prerelease" ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes_file" \
            $prerelease \
            dist/*
